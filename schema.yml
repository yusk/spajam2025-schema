swagger: '2.0'
info:
  title: API Schema
  description: ''
  version: v1
host: localhost:8000
schemes:
- http
- https
basePath: /
consumes:
- application/json
produces:
- application/json
securityDefinitions:
  Basic:
    type: basic
security:
- Basic: []
paths:
  /api/auth/refresh/:
    post:
      operationId: api_auth_refresh_create
      summary: |-
        API View that returns a refreshed token (with new expiration) based on
        existing token
      description: |-
        If 'orig_iat' field (original issued-at-time) is found, will first check
        if it's within expiration window, then copy it to the new token
      parameters:
      - name: data
        in: body
        required: true
        schema:
          $ref: '#/definitions/RefreshJSONWebToken'
      responses:
        '201':
          description: ''
          schema:
            $ref: '#/definitions/RefreshJSONWebToken'
      tags:
      - api
    parameters: []
  /api/auth/user/:
    post:
      operationId: api_auth_user_create
      summary: API View that receives a POST with a user's username and password.
      description: Returns a JSON Web Token that can be used for authenticated requests.
      parameters:
      - name: data
        in: body
        required: true
        schema:
          $ref: '#/definitions/JSONWebToken'
      responses:
        '201':
          description: ''
          schema:
            $ref: '#/definitions/JSONWebToken'
      tags:
      - api
    parameters: []
  /api/auth/uuid/:
    post:
      operationId: api_auth_uuid_create
      description: ''
      parameters:
      - name: data
        in: body
        required: true
        schema:
          $ref: '#/definitions/UnivUniqueID'
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/Token'
      tags:
      - api
    parameters: []
  /api/auth/verify/:
    post:
      operationId: api_auth_verify_create
      description: |-
        API View that checks the veracity of a token, returning the token if it
        is valid.
      parameters:
      - name: data
        in: body
        required: true
        schema:
          $ref: '#/definitions/VerifyJSONWebToken'
      responses:
        '201':
          description: ''
          schema:
            $ref: '#/definitions/VerifyJSONWebToken'
      tags:
      - api
    parameters: []
  /api/matching/:
    post:
      operationId: api_matching_create
      description: マッチングを生成します。既存のアクティブなマッチがある場合はそれを返します。
      parameters: []
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/MatchResult'
        '404':
          description: ''
          schema:
            $ref: '#/definitions/MatchError'
      tags:
      - api
    parameters: []
  /api/matching/debug/similarity/:
    get:
      operationId: api_matching_debug_similarity_list
      description: '[デバッグ用] 全ユーザーとの類似度を計算して返します。'
      parameters: []
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/DebugSimilarityResponse'
      tags:
      - api
    parameters: []
  /api/matching/end/:
    post:
      operationId: api_matching_end_create
      description: 現在のマッチングを終了し、free状態に戻ります。
      parameters: []
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/MatchEndResponse'
        '404':
          description: ''
          schema:
            $ref: '#/definitions/MatchError'
      tags:
      - api
    parameters: []
  /api/matching/history/:
    get:
      operationId: api_matching_history_list
      description: 今日のマッチング履歴を取得します。
      parameters: []
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/MatchHistoryResponse'
      tags:
      - api
    parameters: []
  /api/matching/status/:
    get:
      operationId: api_matching_status_list
      description: 現在のマッチング状態を取得します。
      parameters: []
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/MatchStatus'
      tags:
      - api
    parameters: []
  /api/register/dummy/:
    post:
      operationId: api_register_dummy_create
      description: ''
      parameters:
      - name: data
        in: body
        required: true
        schema:
          $ref: '#/definitions/None'
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/Token'
      tags:
      - api
    parameters: []
  /api/register/user/:
    post:
      operationId: api_register_user_create
      description: ''
      parameters:
      - name: data
        in: body
        required: true
        schema:
          $ref: '#/definitions/UserSignUp'
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/Token'
      tags:
      - api
    parameters: []
  /api/register/uuid/:
    post:
      operationId: api_register_uuid_create
      description: ''
      parameters:
      - name: data
        in: body
        required: true
        schema:
          $ref: '#/definitions/UnivUniqueID'
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/Token'
      tags:
      - api
    parameters: []
  /api/status/:
    get:
      operationId: api_status_list
      description: ''
      parameters:
      - name: limit
        in: query
        description: Number of results to return per page.
        required: false
        type: integer
      - name: offset
        in: query
        description: The initial index from which to return the results.
        required: false
        type: integer
      responses:
        '200':
          description: ''
      tags:
      - api
    parameters: []
  /api/user/:
    get:
      operationId: api_user_list
      description: ''
      parameters:
      - name: limit
        in: query
        description: Number of results to return per page.
        required: false
        type: integer
      - name: offset
        in: query
        description: The initial index from which to return the results.
        required: false
        type: integer
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/User'
      tags:
      - api
    put:
      operationId: api_user_update
      description: ''
      parameters:
      - name: data
        in: body
        required: true
        schema:
          $ref: '#/definitions/User'
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/User'
      tags:
      - api
    delete:
      operationId: api_user_delete
      description: ''
      parameters:
      - name: data
        in: body
        required: true
        schema:
          $ref: '#/definitions/UserDelete'
      responses:
        '204':
          description: ''
          schema:
            $ref: '#/definitions/None'
      tags:
      - api
    parameters: []
  /api/user/github/languages/:
    get:
      operationId: api_user_github_languages_list
      description: GitHubリポジトリの言語統計を取得します。
      parameters: []
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/GitHubLanguagesResponse'
        '400':
          description: ''
          schema:
            $ref: '#/definitions/GitHubCallbackError'
      tags:
      - api
    parameters: []
  /api/user/password/:
    put:
      operationId: api_user_password_update
      description: ''
      parameters:
      - name: data
        in: body
        required: true
        schema:
          $ref: '#/definitions/UserPassword'
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/Token'
      tags:
      - api
    parameters: []
  /api/users/:
    get:
      operationId: api_users_list
      description: ''
      parameters:
      - name: id
        in: query
        description: id
        required: false
        type: string
      - name: name
        in: query
        description: name
        required: false
        type: string
      - name: name__gt
        in: query
        description: name__gt
        required: false
        type: string
      - name: name__lt
        in: query
        description: name__lt
        required: false
        type: string
      - name: tweet
        in: query
        description: tweet
        required: false
        type: string
      - name: order_by
        in: query
        description: 順序
        required: false
        type: string
        enum:
        - id
        - -id
      - name: limit
        in: query
        description: Number of results to return per page.
        required: false
        type: integer
      - name: offset
        in: query
        description: The initial index from which to return the results.
        required: false
        type: integer
      responses:
        '200':
          description: ''
          schema:
            required:
            - count
            - results
            type: object
            properties:
              count:
                type: integer
              next:
                type: string
                format: uri
                x-nullable: true
              previous:
                type: string
                format: uri
                x-nullable: true
              results:
                type: array
                items:
                  $ref: '#/definitions/User'
      tags:
      - api
    parameters: []
  /api/users/{id}/:
    get:
      operationId: api_users_read
      description: ''
      parameters: []
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/User'
      tags:
      - api
    parameters:
    - name: id
      in: path
      description: A UUID string identifying this user.
      required: true
      type: string
      format: uuid
  /api/users/{id}/github/:
    get:
      operationId: api_users_github
      description: ユーザーのGitHub情報（言語統計含む）を取得します。
      parameters: []
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/UserGitHubResponse'
      tags:
      - api
    parameters:
    - name: id
      in: path
      description: A UUID string identifying this user.
      required: true
      type: string
      format: uuid
  /github/callback:
    get:
      operationId: github_callback_list
      description: GitHub OAuthコールバック。認証コードをJWTトークンに交換します。
      parameters:
      - name: code
        in: query
        description: GitHubから受け取った認証コード
        required: true
        type: string
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/GitHubCallbackResponse'
        '400':
          description: ''
          schema:
            $ref: '#/definitions/GitHubCallbackError'
      tags:
      - github
    parameters: []
definitions:
  RefreshJSONWebToken:
    required:
    - token
    type: object
    properties:
      token:
        title: Token
        type: string
        minLength: 1
  JSONWebToken:
    required:
    - email
    - password
    type: object
    properties:
      email:
        title: Email
        type: string
        minLength: 1
      password:
        title: Password
        type: string
        minLength: 1
  UnivUniqueID:
    required:
    - uuid
    type: object
    properties:
      uuid:
        title: Uuid
        type: string
        format: uuid
  Token:
    required:
    - token
    type: object
    properties:
      token:
        title: Token
        type: string
        minLength: 1
  VerifyJSONWebToken:
    required:
    - token
    type: object
    properties:
      token:
        title: Token
        type: string
        minLength: 1
  MatchPartner:
    type: object
    properties:
      id:
        title: Id
        type: string
        format: uuid
      name:
        title: Name
        type: string
        maxLength: 64
      icon:
        title: Icon
        type: string
        readOnly: true
        x-nullable: true
        format: uri
      github_icon_url:
        title: Github icon url
        type: string
        format: uri
        maxLength: 500
        x-nullable: true
  MatchedLanguage:
    required:
    - name
    - icon_url
    type: object
    properties:
      name:
        title: Name
        type: string
        minLength: 1
      icon_url:
        title: Icon url
        type: string
        minLength: 1
  MatchResult:
    required:
    - similarity_score
    - talk_duration
    type: object
    properties:
      id:
        title: ID
        type: integer
        readOnly: true
      partner:
        $ref: '#/definitions/MatchPartner'
      similarity_score:
        title: Similarity score
        type: number
      talk_duration:
        title: Talk duration
        type: integer
      matched_at:
        title: Matched at
        type: string
        format: date-time
        readOnly: true
      remaining_seconds:
        title: Remaining seconds
        type: integer
        readOnly: true
      matched_languages:
        type: array
        items:
          $ref: '#/definitions/MatchedLanguage'
        readOnly: true
  MatchError:
    required:
    - error
    type: object
    properties:
      error:
        title: Error
        type: string
        minLength: 1
  DebugCurrentUser:
    required:
    - id
    - name
    - languages
    type: object
    properties:
      id:
        title: Id
        type: string
        format: uuid
      name:
        title: Name
        type: string
        minLength: 1
      languages:
        title: Languages
        type: object
        additionalProperties:
          type: integer
  DebugSimilarityUser:
    required:
    - user_id
    - user_name
    - similarity_score
    - similarity_percent
    - talk_duration_seconds
    - talk_duration_minutes
    - languages
    type: object
    properties:
      user_id:
        title: User id
        type: string
        format: uuid
      user_name:
        title: User name
        type: string
        minLength: 1
      similarity_score:
        title: Similarity score
        type: number
      similarity_percent:
        title: Similarity percent
        type: string
        minLength: 1
      talk_duration_seconds:
        title: Talk duration seconds
        type: integer
      talk_duration_minutes:
        title: Talk duration minutes
        type: number
      languages:
        type: array
        items:
          type: string
          minLength: 1
  DebugSimilarityResponse:
    required:
    - current_user
    - similarities
    type: object
    properties:
      current_user:
        $ref: '#/definitions/DebugCurrentUser'
      similarities:
        type: array
        items:
          $ref: '#/definitions/DebugSimilarityUser'
  MatchEndResponse:
    required:
    - message
    type: object
    properties:
      message:
        title: Message
        type: string
        minLength: 1
  MatchHistory:
    required:
    - similarity_score
    - talk_duration
    type: object
    properties:
      id:
        title: ID
        type: integer
        readOnly: true
      partner:
        $ref: '#/definitions/MatchPartner'
      similarity_score:
        title: Similarity score
        type: number
      talk_duration:
        title: Talk duration
        type: integer
      matched_at:
        title: Matched at
        type: string
        format: date-time
        readOnly: true
      ended_at:
        title: Ended at
        type: string
        format: date-time
        x-nullable: true
  MatchHistoryResponse:
    required:
    - history
    type: object
    properties:
      history:
        type: array
        items:
          $ref: '#/definitions/MatchHistory'
  MatchStatus:
    required:
    - status
    type: object
    properties:
      status:
        title: Status
        type: string
        enum:
        - free
        - talking
      match:
        $ref: '#/definitions/MatchResult'
  None:
    type: object
    properties: {}
  UserSignUp:
    required:
    - email
    - password
    - password_confirm
    type: object
    properties:
      email:
        title: Email
        type: string
        format: email
        minLength: 1
      password:
        title: Password
        type: string
        minLength: 8
      password_confirm:
        title: Password confirm
        type: string
        minLength: 8
  User:
    required:
    - icon_base64
    type: object
    properties:
      id:
        title: Id
        type: string
        format: uuid
        readOnly: true
      name:
        title: Name
        type: string
        maxLength: 64
      icon:
        title: Icon
        type: string
        readOnly: true
        x-nullable: true
        format: uri
      icon_base64:
        title: Icon base64
        type: string
        minLength: 1
  UserDelete:
    required:
    - password
    type: object
    properties:
      password:
        title: Password
        type: string
        minLength: 8
  GitHubLanguage:
    required:
    - name
    - icon_url
    - count
    - percentage
    type: object
    properties:
      name:
        title: Name
        type: string
        minLength: 1
      icon_url:
        title: Icon url
        type: string
        format: uri
        minLength: 1
      count:
        title: Count
        type: integer
      percentage:
        title: Percentage
        type: number
  GitHubLanguagesResponse:
    required:
    - total_repos
    - languages
    type: object
    properties:
      total_repos:
        title: Total repos
        type: integer
      languages:
        type: array
        items:
          $ref: '#/definitions/GitHubLanguage'
  GitHubCallbackError:
    required:
    - error
    type: object
    properties:
      error:
        title: Error
        type: string
        minLength: 1
  UserPassword:
    required:
    - password
    - new_password
    - new_password_confirm
    type: object
    properties:
      password:
        title: Password
        type: string
        minLength: 8
      new_password:
        title: New password
        type: string
        minLength: 8
      new_password_confirm:
        title: New password confirm
        type: string
        minLength: 8
  UserGitHubResponse:
    required:
    - user_id
    - user_name
    - github_username
    - github_icon_url
    - total_repos
    - languages
    type: object
    properties:
      user_id:
        title: User id
        type: string
        format: uuid
      user_name:
        title: User name
        type: string
        minLength: 1
      github_username:
        title: Github username
        type: string
        minLength: 1
        x-nullable: true
      github_icon_url:
        title: Github icon url
        type: string
        format: uri
        minLength: 1
        x-nullable: true
      total_repos:
        title: Total repos
        type: integer
      languages:
        type: array
        items:
          $ref: '#/definitions/GitHubLanguage'
  GitHubCallbackUser:
    required:
    - id
    - email
    - name
    type: object
    properties:
      id:
        title: Id
        type: string
        format: uuid
      email:
        title: Email
        type: string
        format: email
        minLength: 1
      name:
        title: Name
        type: string
        minLength: 1
  GitHubCallbackResponse:
    required:
    - token
    - user
    type: object
    properties:
      token:
        title: Token
        type: string
        minLength: 1
      user:
        $ref: '#/definitions/GitHubCallbackUser'
